    org: "Cal Poly Formula SAE",

    tags: ["PCB design", "Altium", "Analog"],
    summary: "Two-layer PCB that conditions a PWM signal for the car’s cooling fans.",
    bullets: [
      "Laid out components and routed copper in Altium Designer. The board receives a PWM signal from the LVM, filters it, and passes it to the next set of cooling fans.",
      "Verified the signal filtering at 100 kHz in LTspice using a Bode plot."
    ],
    links: [],

  },
  {

  },
  {

    tags: ["Systems", "Autonomy", "Embedded"],
    summary: "Electronics integration plan for an autonomous vehicle.",
    bullets: [
      "Integrated devices include the NVIDIA Jetson AGX Orin compute module, three automotive RGB cameras, and an Ouster LiDAR sensor.",

    ],
    links: [],
    image: ""
  }

];

const EXPERIENCE = [
  {role: "Head of Outreach / Developer", org: "ThrAIve AI", date: "Oct 2024 – May 2026", bullets: [
    "Connected with 5–10 nonprofits each year to host educational webinars on AI safety.",
    "Helped build a Flask flier-generation web app for outreach and fundraising for HART of Folsom, a local homeless assistance service."]},
  {role: "Code Coach", org: "theCoderSchool Folsom", date: "June 2025 – Feb 2026", bullets: [
    "Guided 10–15 students weekly through Python, JavaScript, and Scratch projects.",
    "Tracked individual progress and delivered detailed project reviews."]},
  {role: "Founder and Captain", org: "Reboot FTC Robotics Team", date: "Sept 2022 – Sept 2025", bullets: [
    "Led hardware and software integration: sensors, encoders, and control software for autonomous operation.",
    "Designed, programmed (Java), and built a competition robot each season. Earned the Inspire Award and a Finalist Alliance selection.",
    "Secured $6,000+ in sponsorships and grants and launched a mentorship program for younger students."]},
  {role: "User Interface Intern", org: "ActivityBees", date: "June 2023 – Aug 2023", bullets: [
    "Reviewed a startup app’s UI and documented key improvements for the lead developer.",
    "Implemented UI changes under mentorship."]}
];

const SKILLS = {
  "Design tools": "Altium Designer (schematic capture, PCB layout), Autodesk Fusion 360 (certified), LTspice, Arduino IDE",
  "Programming": "Python, Arduino C++, Java",
  "Lab equipment": "Multimeter, oscilloscope, function generator"
};

const AWARDS = [
  "AP Scholar with Distinction",
  "Finalist Alliance and Inspire Award (highest honor), FTC CA Northeast League Championship, 2025",
  "Think Award, FTC CA Northeast League Championship, 2024",
  "Bronze Medalist, SkillsUSA CA Cybersecurity Competition, 2025"
];
/* =================== END EDITABLE SECTION =================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl = u => /^https?:\/\//.test(u) ? u : "#";

$("contact").innerHTML =
  `<a href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a>` +
  PROFILE.links.map(l => `<a href="${safeUrl(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
$("aboutText").innerHTML = PROFILE.about.map(p => `<p>${esc(p)}</p>`).join("");
$("skillList").innerHTML = Object.entries(SKILLS).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
$("awardList").innerHTML = AWARDS.map(a => `<li>${esc(a)}</li>`).join("");
$("expList").innerHTML = EXPERIENCE.map(e => `
  <article class="job"><div class="meta">${esc(e.date)}</div><div>
  <h3>${esc(e.role)}</h3><p class="org">${esc(e.org)}</p>
  <ul>${e.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div></article>`).join("");
$("yr").textContent = new Date().getFullYear();

let active = "All";
function renderProjects() {
  const list = PROJECTS.filter(p => active === "All" || p.tags.includes(active));
  $("projectList").innerHTML = list.map(p => `
    <article class="project"><div class="meta">${esc(p.date)}</div><div>
    <h3>${esc(p.title)}</h3><p class="org">${esc(p.org)}</p>
    <p style="margin:0">${esc(p.summary)}</p>
    <ul>${p.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
    ${p.image ? `<img src="${safeUrl(p.image)}" alt="${esc(p.title)}">` : ""}
    <div class="chips">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
    ${(p.links || []).length ? `<p style="margin:12px 0 0">${p.links.map(l => `<a href="${safeUrl(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" &nbsp; ")}</p>` : ""}
    </div></article>`).join("");
}
function renderFilters() {
  const tags = ["All", ...new Set(PROJECTS.flatMap(p => p.tags))];
  $("filters").innerHTML = tags.map(t => `<button type="button" aria-pressed="${t === active}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  $("filters").querySelectorAll("button").forEach(b => b.onclick = () => { active = b.dataset.t; renderFilters(); renderProjects(); });
}
renderFilters(); renderProjects();

$("theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
</script>
</body>
</html>
