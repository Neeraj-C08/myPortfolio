<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neeraj Chandekar – Electrical Engineering Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
<nav aria-label="Sections">
  <a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#about">About</a>
  <button id="theme" type="button" aria-label="Toggle light or dark theme">Theme</button>
</nav>

<header>
  <h1>Neeraj Chandekar</h1>
  <p class="tag">Electrical engineering student at Cal Poly San Luis Obispo, designing PCBs, autonomous vehicle electronics, and semiconductor devices.</p>
  <div class="links" id="contact"></div>
  <svg class="traces" viewBox="0 0 800 70" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M0 35H150L180 12H330L360 35H470L500 58H640L670 35H800"/>
    <path d="M0 58H90L110 46H240" opacity=".5"/>
    <path d="M520 12H800" opacity=".5"/>
    <circle cx="150" cy="35" r="6" fill="var(--bg)"/><circle cx="360" cy="35" r="6" fill="var(--bg)"/><circle cx="640" cy="58" r="6" fill="var(--bg)"/>
  </svg>
</header>

<!-- ================= PROJECTS: add new ones to this list =================
Copy one block, paste it at the TOP of the list, and edit. Fields:
  title, org (lab/club/class), date (text), tags (list), summary (one line),
  bullets (list), links (optional: [{label, url}]),
  images (optional: [{src, caption}] — put picture files in the images/ folder, e.g. src: "images/my-pic.png")
-->
<section id="projects">
  <h2>Projects</h2>
  <div class="filters" id="filters"></div>
  <div id="projectList"></div>
</section>

<section id="skills" class="skills">
  <h2>Skills</h2>
  <dl id="skillList"></dl>
</section>

<section id="about">
  <h2>About</h2>
  <div id="aboutText"></div>
</section>

<footer>© <span id="yr"></span> Neeraj Chandekar</footer>
</div>

<script>
/* ===================== EDIT THIS SECTION ===================== */
const PROFILE = {
  email: "nchandek@calpoly.edu",
  links: [
    {label: "LinkedIn", url: "https://linkedin.com/in/neeraj-chandekar-82a1b1238"},
    {label: "GitHub", url: "https://github.com/Neeraj-C08"}
  ],
  about: [
    "I am a first-year Electrical Engineering student at Cal Poly San Luis Obispo (B.S., expected May 2030). I like work where hardware and software meet: circuit boards, sensors, communication buses, and the code that runs on them.",
    "Before college I founded and captained an FTC robotics team for three years, taught Python and JavaScript to kids as a coding coach, and led AI-safety outreach with local nonprofits."
  ]
};

// Newest first. Copy a block, paste at the top, and edit.
const PROJECTS = [
  {
    title: "Cooling Fan Control Breakout Board",
    org: "Cal Poly Formula SAE",
    date: "Oct 2026",
    tags: ["PCB design", "Altium", "Analog"],
    summary: "Two-layer PCB that conditions a PWM signal for the car’s cooling fans.",
    bullets: [
      "Laid out components and routed copper in Altium Designer. The board receives a PWM signal from the LVM, filters it, and passes it to the next set of cooling fans.",
      "Verified the signal filtering at 100 kHz in LTspice using a Bode plot."
    ],
    links: [],
    images: [
      {src: "images/Screenshot 2026-11-11 212728.png", caption: "PCB layout (Altium Designer)"},
      {src: "images/Screenshot 2026-11-11 212849.png", caption: "Schematic"}
    ]
  },
  {
    title: "MOS Capacitor Research",
    org: "Cal Poly Micro Systems Technology Group (MST)",
    date: "Sept 2026 – present",
    tags: ["Research", "Semiconductors", "Modeling"],
    summary: "Fabricating and testing a MOS capacitor in the campus MicroFabrication Laboratory.",
    bullets: [
      "Developing a mathematical model of the capacitance-voltage (C-V) relationship to benchmark against measurements once physical testing begins."
    ],
    links: [],
    images: []
  },
  {
    title: "Autonomy Electronics Integration Plan",
    org: "Cal Poly Prototype Vehicles Laboratory",
    date: "Aug 2026 – present",
    tags: ["Systems", "Autonomy", "Embedded"],
    summary: "Electronics integration plan for an autonomous vehicle.",
    bullets: [
      "Integrated devices include the NVIDIA Jetson AGX Orin compute module, three automotive RGB cameras, and an Ouster LiDAR sensor.",
      "Produced a complete block diagram and documented all interconnects and protocols: GMSL2 camera links, a 10G Ethernet LiDAR interface, and a CAN 2.0B vehicle bus."
    ],
    links: [],
    images: []
  }
  // ← paste new projects above this line
];

const SKILLS = {
  "Design tools": "Altium Designer (schematic capture, PCB layout), Autodesk Fusion 360 (certified), LTspice, Arduino IDE",
  "Programming": "Python, Arduino C++, Java",
  "Lab equipment": "Multimeter, oscilloscope, function generator"
};

/* =================== END EDITABLE SECTION =================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl = u => /^(https?:\/\/|images\/)/.test(u) ? u : "#";

$("contact").innerHTML =
  `<a href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a>` +
  PROFILE.links.map(l => `<a href="${safeUrl(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
$("aboutText").innerHTML = PROFILE.about.map(p => `<p>${esc(p)}</p>`).join("");
$("skillList").innerHTML = Object.entries(SKILLS).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
$("yr").textContent = new Date().getFullYear();

let active = "All";
function renderProjects() {
  const list = PROJECTS.filter(p => active === "All" || p.tags.includes(active));
  $("projectList").innerHTML = list.map(p => `
    <article class="project">
      <div class="head">
        <div><h3>${esc(p.title)}</h3><p class="org">${esc(p.org)}</p></div>
        <div class="meta">${esc(p.date)}</div>
      </div>
      <p class="summary">${esc(p.summary)}</p>
      <ul>${p.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
      ${(p.images || []).length ? `<div class="gallery">${p.images.map(i => `
        <figure><a href="${safeUrl(i.src)}" target="_blank" rel="noopener"><img src="${safeUrl(i.src)}" alt="${esc(i.caption || p.title)}" loading="lazy"></a>
        <figcaption>${esc(i.caption || "")}</figcaption></figure>`).join("")}</div>` : ""}
      <div class="chips">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
      ${(p.links || []).length ? `<p class="plinks">${p.links.map(l => `<a href="${safeUrl(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join("")}</p>` : ""}
    </article>`).join("");
}
function renderFilters() {
  const tags = ["All", ...new Set(PROJECTS.flatMap(p => p.tags))];
  $("filters").innerHTML = tags.map(t => `<button type="button" aria-pressed="${t === active}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  $("filters").querySelectorAll("button").forEach(b => b.onclick = () => { active = b.dataset.t; renderFilters(); renderProjects(); });
}
renderFilters(); renderProjects();

$("theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
</script>
</body>
</html>
